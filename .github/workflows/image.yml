name: Image

# The Docker build is not run on every pull request, deliberately.
#
# On a source-only change it re-verifies almost nothing: the image's build stage
# runs the same `npm run build` that the `verify` job in ci.yml already ran, so a
# second pass proves the same `tsc` invocation twice and costs a minute and a half
# of runner time doing it. And every merge to main publishes `edge` from
# release.yml anyway, so the image is built once per change regardless — the
# pull-request build was a third one, a few minutes earlier.
#
# What the image build *does* verify uniquely is how the image is assembled and
# how it behaves once started: the production install (`npm ci --omit=dev` plus
# the runtime prune) against the lockfile, the multi-stage copy, the Dockerfile
# itself, and then — since #39 — the running container's posture, because
# `read_only: true` and `cap_drop: ALL` are claims until something checks them.
# None of that can change without one of the paths below changing with it.
#
# `package.json` is on that list, which also makes this the milestone gate: the
# version bump that closes a milestone touches it, so the last pull request of
# every milestone builds the image before it merges.
#
# A release lands as a direct push to main (a "release:" commit, no PR, #715),
# which the `pull_request` trigger above never sees — so without the `push`
# trigger below, the exact commit that release.yml tags and publishes is the
# one commit this gate never validates. Unfiltered by path, unlike the PR
# trigger: a release push is rare enough that running the full build on every
# one of them costs nothing next to leaving it unchecked.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - package.json
      - package-lock.json
      - tsconfig.build.json
      - scripts/copy-assets.mjs
      - scripts/prune-runtime-deps.mjs
      - scripts/verify-image.sh
      - .hadolint.yaml
      - .github/workflows/image.yml
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Docker build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Fails fast, before a multi-minute build, on a Dockerfile mistake — see
      # .hadolint.yaml for the three rules ignored here and why each is a
      # false positive for this specific multi-stage build rather than a real
      # relaxation.
      - name: Lint the Dockerfile
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint Dockerfile

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      # Loaded into the local daemon rather than pushed: publishing happens in
      # release.yml, and the next step needs to actually run this image.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: balancr:ci
          build-args: |
            GIT_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The OCI revision label must be present and be the commit being built.
      - name: Check the revision label
        run: |
          rev="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' balancr:ci)"
          if [ "$rev" != "${{ github.sha }}" ]; then
            echo "::error::org.opencontainers.image.revision is '$rev', expected ${{ github.sha }}"
            exit 1
          fi
      # A built image is not a working one. This starts it with the same flags
      # compose uses and checks the hardening is real rather than declared —
      # non-root, an unwritable /app, no capabilities, a healthcheck that works —
      # and records size and startup time in the job summary so a regression in
      # either is something a reviewer walks past rather than has to go looking
      # for (#39). The script runs by hand too; that is why it is a script.
      - name: Verify the image
        run: scripts/verify-image.sh balancr:ci

      # This is a CI-side backstop independent of the Harbor scan tracked in
      # #395: it scans the same image that verify-image.sh just hardened,
      # without depending on Harbor or the homelab network being reachable.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "balancr:ci"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
