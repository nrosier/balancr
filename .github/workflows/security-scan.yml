name: Security scan

# Multi-engine security scanning (#854): Syft builds an SBOM, Grype scans it,
# Trivy cross-checks the repository (vulnerabilities, secrets, Dockerfile/IaC
# misconfiguration), and both result sets are published to GitHub Code Scanning
# under their own categories.
#
# This is reporting and triage, not a merge gate. Both scanners are non-failing
# on findings. The gate for image vulnerabilities stays where it was: the Trivy
# step in image.yml, which scans the built image. This workflow scans the
# checkout (`fs` mode), so the image is not scanned twice on the same event, and
# adds Code Scanning visibility plus a weekly re-scan that catches CVEs
# disclosed after a merge. See docs/ci.md and docs/security-model.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Scan (Syft, Grype, Trivy)
    runs-on: ubuntu-26.04
    # Job-scoped, as in release.yml. `id-token: write` is requested by the spec
    # of #854 but nothing here uses OIDC yet; it is for the follow-up that
    # attests the SBOM with Cosign. Remove it if that follow-up is dropped.
    permissions:
      contents: read
      security-events: write
      id-token: write
    env:
      # A fork pull request gets a read-only token, so upload-sarif would fail
      # there. The scanners still run and the raw SARIF goes to the artifact.
      # pull_request_target is deliberately not used to work around this.
      CAN_UPLOAD: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Syft: CycloneDX SBOM of the checkout. The artifact is uploaded by the
      # explicit step below so its name and retention are controlled here.
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          # renovate: datasource=github-releases depName=anchore/syft
          syft-version: v1.57.0
          upload-artifact: false

      - name: Upload SBOM
        if: ${{ !cancelled() && hashFiles('sbom.cyclonedx.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 30

      # Grype: scans the SBOM, not the tree. `fail-build: false` because a
      # finding must not red-flag the run or skip later steps.
      - name: Scan SBOM (Grype)
        id: grype
        if: ${{ !cancelled() && hashFiles('sbom.cyclonedx.json') != '' }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.cyclonedx.json
          output-format: sarif
          output-file: grype-results.sarif
          fail-build: false
          # renovate: datasource=github-releases depName=anchore/grype
          grype-version: v0.121.3

      # Trivy: independent of Grype's outcome. fs mode on the checkout; the
      # built image is scanned (and gated) by image.yml.
      - name: Scan repository (Trivy)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.76.2

      - name: Upload Grype SARIF to Code Scanning
        if: ${{ !cancelled() && env.CAN_UPLOAD == 'true' && hashFiles('grype-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: grype-results.sarif
          category: grype-engine

      - name: Upload Trivy SARIF to Code Scanning
        if: ${{ !cancelled() && env.CAN_UPLOAD == 'true' && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-engine

      # Raw results, so fork PRs and scheduled runs keep them and the report
      # job below can read them.
      - name: Upload SARIF files
        if: ${{ !cancelled() && (hashFiles('grype-results.sarif') != '' || hashFiles('trivy-results.sarif') != '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-results
          path: |
            grype-results.sarif
            trivy-results.sarif
          if-no-files-found: ignore
          retention-days: 30

  # Scheduled runs only. Kept apart from `scan` so `issues: write` is never
  # granted to the job that runs third-party scanners.
  report:
    name: Open or update the security issue
    needs: scan
    if: ${{ github.event_name == 'schedule' && !cancelled() }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download SARIF files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sarif-results
          path: sarif

      - name: Open or update the security issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SARIF_DIR: sarif
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const MARKER = '<!-- security-scan:balancr-854 -->';
            const sources = [
              ['Grype', 'grype-results.sarif'],
              ['Trivy', 'trivy-results.sarif'],
            ];

            // GitHub's bands: 9.0+ critical, 7.0 to 8.9 high. Fall back to the
            // result level when a rule carries no security-severity.
            function band(score, level) {
              const n = Number.parseFloat(score);
              if (Number.isFinite(n)) {
                if (n >= 9.0) return 'critical';
                if (n >= 7.0) return 'high';
                return null;
              }
              return level === 'error' ? 'high' : null;
            }

            const findings = [];
            for (const [engine, file] of sources) {
              const p = path.join(process.env.SARIF_DIR, file);
              if (!fs.existsSync(p)) {
                core.warning(`${file} not found, skipping ${engine}`);
                continue;
              }
              const sarif = JSON.parse(fs.readFileSync(p, 'utf8'));
              for (const run of sarif.runs ?? []) {
                const rules = run.tool?.driver?.rules ?? [];
                for (const r of run.results ?? []) {
                  const rule = rules[r.ruleIndex] ?? rules.find((x) => x.id === r.ruleId);
                  const score = rule?.properties?.['security-severity']
                    ?? r.properties?.['security-severity'];
                  const severity = band(score, r.level ?? rule?.defaultConfiguration?.level);
                  if (!severity) continue;
                  findings.push({
                    engine,
                    severity,
                    rule: r.ruleId ?? 'unknown',
                    uri: r.locations?.[0]?.physicalLocation?.artifactLocation?.uri ?? '',
                  });
                }
              }
            }

            if (findings.length === 0) {
              core.info('No High/Critical findings; nothing to report.');
              return;
            }

            const count = (engine, sev) =>
              findings.filter((f) => f.engine === engine && f.severity === sev).length;
            const rows = sources.map(([engine]) =>
              `| ${engine} | ${count(engine, 'critical')} | ${count(engine, 'high')} |`);

            // Rule ID and file only. Never the message: for secret findings
            // it can carry the matched text.
            const seen = new Set();
            const lines = [];
            for (const f of findings) {
              const key = `${f.engine}|${f.rule}|${f.uri}`;
              if (seen.has(key)) continue;
              seen.add(key);
              lines.push(`- ${f.engine}, ${f.severity}: \`${f.rule}\` ${f.uri ? `in \`${f.uri}\`` : ''}`.trim());
            }
            const MAX = 40;
            const listed = lines.slice(0, MAX);
            if (lines.length > MAX) listed.push(`- ... and ${lines.length - MAX} more`);

            const body = [
              MARKER,
              '## Scheduled security scan: High/Critical findings',
              '',
              `Last scheduled run: ${process.env.RUN_URL}`,
              '',
              '| Engine | Critical | High |',
              '|---|---|---|',
              ...rows,
              '',
              'Details are in the Code Scanning alerts (categories `grype-engine` and `trivy-engine`) and in the `sarif-results` artifact of that run.',
              '',
              ...listed,
              '',
              'This issue is updated in place by `.github/workflows/security-scan.yml` on every scheduled run that has findings. Closing it is manual.',
            ].join('\n');

            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              labels: 'security',
              per_page: 100,
            });
            const existing = open.find((i) => !i.pull_request && i.body?.includes(MARKER));

            if (existing) {
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                ...context.repo,
                title: 'Security scan: High/Critical findings',
                body,
                labels: ['security'],
              });
              core.info(`Opened issue #${created.data.number}`);
            }
