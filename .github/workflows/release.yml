name: Release

# Publishes the image on every push to main (as `edge`) and on every version tag.
# Tagging is the release gesture: `git tag v0.3.0 && git push --tags`.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      # Keyless Cosign signing: the job's OIDC token is exchanged for a
      # short-lived Fulcio certificate. Granted on this job only, never on the
      # workflow, so no other job can mint an identity for this repository.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/balancr
          # `latest` is opt-in below so a release candidate never becomes the
          # tag that `docker pull ghcr.io/nrosier/balancr` resolves to.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc') }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          # Stamped into the image so the startup log names the commit, not just
          # the version. `github.sha` is the merge commit for a branch push and the
          # tagged commit for a tag, which is the commit that was built either way.
          build-args: |
            BALANCR_REVISION=${{ github.sha }}
            GIT_REVISION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build provenance attestations, so a pulled image carries a signed
          # record of how and where it was built (SLSA-style). `true` is
          # build-push-action's own default; kept explicit so this doesn't
          # silently regress if the action's default ever changes.
          provenance: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Signs the pushed digest (an OCI index, because provenance is on), never a
      # tag: one signature on the digest covers every tag pointing at it. No
      # continue-on-error — a release whose signature failed must fail the job.
      # Inputs go through env, not into the script text.
      - name: Sign the image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/balancr
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Proves the signature just written is the one a user will check: the
      # exact identity of this workflow file at this ref, GitHub's OIDC issuer.
      - name: Verify the signature
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/balancr
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}" > /dev/null
